<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 2 Teacher Resource Hub</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #00cec9;
            --accent: #fd79a8;
            --bg: #ffeaa7;
            --text: #2d3436;
        }
        body { 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            background-image: radial-gradient(#fab1a0 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .container { max-width: 1000px; margin: auto; }
        header { text-align: center; margin-bottom: 40px; padding: 20px; background: white; border-radius: 20px; border: 5px solid var(--primary); box-shadow: 10px 10px 0px rgba(0,0,0,0.1); }
        h1 { color: var(--primary); font-size: 3em; margin: 0; text-shadow: 2px 2px 0px white; }
        .resource-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 25px; }
        .card { 
            background: white; 
            border: 4px solid var(--secondary); 
            border-radius: 20px; 
            padding: 20px; 
            box-shadow: 8px 8px 0px rgba(0,0,0,0.1); 
            cursor: pointer; 
            transition: transform 0.2s;
        }
        .card:hover { transform: scale(1.05); }
        .card h3 { margin-top: 0; color: var(--primary); font-size: 1.4em; }
        .details { display: none; margin-top: 15px; border-top: 3px dashed var(--secondary); padding-top: 10px; }
        .details p { font-size: 1.1em; color: #636e72; }
        .btn-link { 
            display: inline-block; 
            background: var(--accent); 
            color: white; 
            padding: 10px 20px; 
            border-radius: 50px; 
            text-decoration: none; 
            font-weight: bold; 
            margin-top: 10px;
            border: 2px solid white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 G2 Teacher Magic Hub 🌟</h1>
            <p>Grab your resources and let the fun begin!</p>
        </header>
        <div class="resource-grid" id="resource-container"></div>
    </div>
    <script>
        const resources = [
            { title: "Storyline Online", desc: "Award-winning books read by actors.", link: "https://storylineonline.net/" },
            { title: "Vooks", desc: "Animated storybooks that bring tales to life.", link: "https://www.vooks.com/" },
            { title: "KidLit TV", desc: "Read-out-louds and author fun.", link: "https://www.kidlit.tv/category/read-out-loud/" },
            { title: "Storytime from Space", desc: "Out-of-this-world reading!", link: "https://storytimefromspace.com/" },
            { title: "Julie's Library", desc: "Julie Andrews reads your favorite books.", link: "https://www.julieslibraryshow.org/" },
            { title: "Cosmic Kids", desc: "Yoga and movement for busy bodies.", link: "https://cosmickids.com/" },
            { title: "Gotham Reads", desc: "Amazing stories and read-alouds.", link: "https://www.youtube.com/channel/UCvdOFUzQd9XhmfCwnQ5mXlQ/videos" },
            { title: "BOOKENDS", desc: "Reading with Julia Cook.", link: "https://www.youtube.com/playlist?list=PLdKJzzzGGdzEwJjMVtUZEX2ZsLNwKCctg" },
            { title: "SplashLearn", desc: "Math and English games for G2.", link: "https://www.splashlearn.com/signin#/" },
            { title: "ICRT News For Kids", desc: "Educational news tailored for kids.", link: "https://www.icrt.com.tw/news_lunchbox.php?mlevel1=7&mlevel2=96" }
        ];

        const container = document.getElementById('resource-container');
        resources.forEach(r => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `<h3>${r.title}</h3><div class="details"><p>${r.desc}</p><a href="${r.link}" class="btn-link" target="_blank">Go to Site!</a></div>`;
            card.onclick = () => {
                const det = card.querySelector('.details');
                det.style.display = det.style.display === 'block' ? 'none' : 'block';
            };
            container.appendChild(card);
        });
    </script>
</body>
</html>
